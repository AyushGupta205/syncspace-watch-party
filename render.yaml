services:
  - type: web
    name: syncspace-watch-party
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: data/syncspace.db
      - key: CLIENT_ORIGIN
        sync: false
